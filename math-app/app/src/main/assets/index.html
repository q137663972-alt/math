<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>数学乐园 · 小学1-6年级 · 口算/竖式/应用题/图形</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <h3>⚙️ 设置</h3>
    <div class="set-row"><label>🔊 读题</label><div id="ttsSwitch" class="switch on"></div></div>
    <div class="set-row"><label>语速</label><input id="rateRange" type="range" min="0.5" max="1.2" step="0.05" value="0.85"></div>
    <div class="set-row"><label>试听</label><button class="btn ghost" style="width:auto;padding:8px 16px" onclick="speak('欢迎来到数学乐园，一起来口算吧')">🔊 播放</button></div>
    <div class="set-row"><label>进度备份</label>
      <div>
        <button class="btn ghost" style="width:auto;padding:8px 12px" onclick="exportProgress()">💾 导出</button>
        <button class="btn ghost" style="width:auto;padding:8px 12px" onclick="importProgress()">📥 恢复</button>
      </div>
    </div>
    <textarea id="backupBox" class="hidden" rows="3" style="width:100%;font-size:12px;margin-top:6px"></textarea>
    <button class="btn pink" style="margin-top:8px" onclick="closeSettings()">完成</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- 单元知识点配置：1-6 年级 -->
<!-- 内容包热更新：加载器必须先于数据文件加载 -->

<!-- 题目生成器：无限题量 -->
<script src="js/gen.js"></script>
<!-- 发音引擎：原生 zh-CN TTS + 有道音频兜底 -->
<script src="js/tts.js"></script>
<!-- 9 种玩法 -->
